name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast lane: no Stockfish download; UI tests use a small UCI fixture. Build on
  # every platform it claims to support.  GCC is here on purpose — it is
  # stricter than clang and is what most Linux users build with.  The macOS
  # entry compiles both slices, so an Intel-only breakage cannot slip through.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux · gcc
            os: ubuntu-latest
            cc: gcc
            cflags: -O2 -Werror
          - name: linux · clang
            os: ubuntu-latest
            cc: clang
            cflags: -O2 -Werror
          - name: macos · intel + apple silicon
            os: macos-latest
            cc: clang
            cflags: -O2 -Werror -arch arm64 -arch x86_64
    steps:
      - uses: actions/checkout@v7

      - name: HTTPS development libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Build (warnings are errors)
        run: make tui CC=${{ matrix.cc }} CFLAGS="${{ matrix.cflags }}"

      - name: Prefix keybindings (pseudo-terminal, UCI fixture)
        run: make test-keybindings CC=${{ matrix.cc }} CFLAGS="${{ matrix.cflags }}"

      - name: Offline tests (mock engine and HTTP transport)
        run: make test CC=${{ matrix.cc }} CFLAGS="${{ matrix.cflags }}"

  # Same, on the Windows side of the #ifdefs.
  windows:
    name: windows · gcc (msys2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make
          pacboy: gcc:p curl-winssl:p pkgconf:p

      - name: Build (warnings are errors)
        run: make tui CFLAGS="-O2 -Werror"

      - name: Offline tests (mock engine and HTTP transport)
        run: make test CFLAGS="-O2 -Werror"
