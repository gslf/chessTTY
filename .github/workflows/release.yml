name: Release


on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Makefile'
      - 'tools/check_release.py'
      - 'src/**'
      - 'tests/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    # 22.04 on purpose: binaries built against an older glibc keep working on
    # newer distros, not the other way round.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            sf_archs: x86-64
          - runner: ubuntu-22.04-arm
            arch: arm64
            sf_archs: armv8
    steps:
      - uses: actions/checkout@v7

      - name: HTTPS development libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi

      - name: Build Stockfish
        run: make engine SF_ARCHS="${{ matrix.sf_archs }}"

      - name: Build ChessTTY
        run: make tui

      - name: Offline tests (mock engine and HTTP transport)
        run: make test

      - name: Package
        run: make dist DIST_ARCH=${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: chesstty-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macos-universal
    # Apple Silicon runner; the x86_64 half is cross-compiled and merged with
    # lipo, so one archive covers both kinds of Mac.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi

      - name: Build Stockfish (arm64 + x86_64)
        run: |
          set -euo pipefail
          make engine SF_ARCHS="apple-silicon" SF_COMP=clang
          mv engine/stockfish engine/stockfish-arm64
          make engine SF_ARCHS="x86-64" SF_COMP=clang
          mv engine/stockfish engine/stockfish-x86_64
          lipo -create -output engine/stockfish \
               engine/stockfish-arm64 engine/stockfish-x86_64
          rm engine/stockfish-arm64 engine/stockfish-x86_64
          lipo -info engine/stockfish

      - name: Build ChessTTY (universal)
        run: make tui CC=/usr/bin/clang CFLAGS="-O2 -arch arm64 -arch x86_64 -isysroot $(xcrun --show-sdk-path)" LDFLAGS="-L$(xcrun --show-sdk-path)/usr/lib"

      - name: Ad-hoc signatures after universal linking
        run: |
          codesign --force --sign - chesstty
          codesign --force --sign - engine/stockfish

      - name: Offline tests (mock engine and HTTP transport)
        run: make test

      - name: Package
        run: make dist DIST_ARCH=universal

      - uses: actions/upload-artifact@v7
        with:
          name: chesstty-macos-universal
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make zip curl
          pacboy: gcc:p curl-winssl:p pkgconf:p

      - name: Artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi

      - name: Build Stockfish
        run: make engine SF_ARCHS="x86-64"

      - name: Build ChessTTY
        run: make tui LDFLAGS="-static"

      - name: Offline tests (mock engine and HTTP transport)
        run: make test

      - name: Package
        run: make dist DIST_ARCH=x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: chesstty-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  verify:
    name: verify · ${{ matrix.name }}
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 · Ubuntu 22.04
            runner: ubuntu-22.04
            artifact: chesstty-linux-x86_64
            container: ubuntu:22.04
            runtime: libcurl4 libssl3
          - name: Linux arm64 · Ubuntu 22.04
            runner: ubuntu-22.04-arm
            artifact: chesstty-linux-arm64
            container: ubuntu:22.04
            runtime: libcurl4 libssl3
          - name: Linux x86_64 · Ubuntu 24.04
            runner: ubuntu-24.04
            artifact: chesstty-linux-x86_64
            container: ubuntu:24.04
            runtime: libcurl4t64 libssl3t64
          - name: macOS · Apple Silicon
            runner: macos-15
            artifact: chesstty-macos-universal
          - name: macOS · Intel
            runner: macos-15-intel
            artifact: chesstty-macos-universal
          - name: Windows · without MSYS2 on PATH
            runner: windows-2022
            artifact: chesstty-windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-artifact
      - name: Artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi
      - name: Linux runtime-only container
        if: runner.os == 'Linux'
        env:
          CONTAINER: ${{ matrix.container }}
          RUNTIME_PACKAGES: ${{ matrix.runtime }}
        run: |
          docker run --rm -v "$PWD:/source:ro" -e VERSION -e RUNTIME_PACKAGES "$CONTAINER" sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends python3 ca-certificates libstdc++6 $RUNTIME_PACKAGES
            python3 /source/tools/check_release.py /source/release-artifact/*.tar.gz --version "$VERSION"
          '
      - name: macOS native runtime and universal slices
        if: runner.os == 'macOS'
        run: python3 tools/check_release.py release-artifact/*.tar.gz --version "$VERSION"
      - name: Windows native runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem release-artifact/*.zip).FullName
          python tools/check_release.py "$archive" --version "$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: publish the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: chesstty-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            # a tag such as v1.0.0-rc1 is published as a pre-release
            flags=(--generate-notes)
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" assets/* \
              --title "ChessTTY ${TAG#v}" "${flags[@]}"
          fi
